name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force rebuild web and Odoo addon update
        type: boolean
        default: false
      confirm_backup:
        description: Type BACKUP_REQUIRED to confirm blocking predeploy backup
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: galantes-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_backup == 'BACKUP_REQUIRED' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://galantesjewelry.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── FASE 1: PREFLIGHT + BACKUP BLOQUEANTE + ROTACIÓN ─────────────────────
      - name: Pre-deploy backup + rotate old backups
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: TARGET_SHA
          script: |
            set -Eeuo pipefail

            APP_PATH="/home/yoeli/galantesjewelry"
            BACKUP_ROOT="/home/yoeli/deploy-backups"
            PRODUCTION_DB="galantes_prod"
            KEEP_BACKUPS="5"
            MIN_FREE_MB="8192"

            log() { printf '[galantes-backup] %s\n' "$*"; }
            fail() { printf '[galantes-backup] FATAL: %s\n' "$*" >&2; exit 1; }

            cd "$APP_PATH"

            # ── Guardarraíl: DB correcta ──────────────────────────────────────
            DB_VAL=$(awk -F= '$1=="ODOO_DB"{print $2}' .env.prod | tail -1)
            [ "$DB_VAL" = "$PRODUCTION_DB" ] || fail "ODOO_DB is '$DB_VAL', expected '$PRODUCTION_DB'"
            log "DB guard OK: $PRODUCTION_DB"

            # ── Guardarraíl: espacio libre ────────────────────────────────────
            FREE_MB=$(df -Pm / | awk 'NR==2{print $4}')
            [ "${FREE_MB:-0}" -ge "$MIN_FREE_MB" ] || {
              log "Low disk (${FREE_MB}MB) — cleaning Docker cache first..."
              sudo docker builder prune -af --filter until=72h >/dev/null 2>&1 || true
              sudo docker image prune -af --filter until=168h >/dev/null 2>&1 || true
              FREE_MB=$(df -Pm / | awk 'NR==2{print $4}')
              [ "${FREE_MB:-0}" -ge "$MIN_FREE_MB" ] || fail "Only ${FREE_MB}MB free after cleanup; require ${MIN_FREE_MB}MB"
            }
            log "Disk OK: ${FREE_MB}MB free"

            # ── Guardarraíl: tunnel intacto ───────────────────────────────────
            TUNNEL_STATUS=$(sudo docker inspect -f '{{.State.Status}}' galantes_tunnel_prod 2>/dev/null || echo missing)
            [ "$TUNNEL_STATUS" = "running" ] || fail "Cloudflare tunnel not running: $TUNNEL_STATUS"
            TUNNEL_ID_BEFORE=$(sudo docker inspect -f '{{.Id}}' galantes_tunnel_prod)
            TUNNEL_STARTED_BEFORE=$(sudo docker inspect -f '{{.State.StartedAt}}' galantes_tunnel_prod)
            log "Tunnel guard: ID=${TUNNEL_ID_BEFORE:0:12} Started=$TUNNEL_STARTED_BEFORE"

            # ── Crear directorio de backup ────────────────────────────────────
            TS=$(date -u +%Y%m%dT%H%M%SZ)
            BACKUP_DIR="$BACKUP_ROOT/$TS-${TARGET_SHA:0:12}"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            log "Backup dir: $BACKUP_DIR"

            # ── Guardar archivos de configuración ─────────────────────────────
            cp .env.prod "$BACKUP_DIR/.env.prod"
            chmod 600 "$BACKUP_DIR/.env.prod"
            cp docker-compose.production.yml "$BACKUP_DIR/docker-compose.production.yml"
            git rev-parse HEAD > "$BACKUP_DIR/git-head-before.txt"
            git status --short > "$BACKUP_DIR/git-status-before.txt" || true
            sudo docker compose --env-file .env.prod -f docker-compose.production.yml ps \
              > "$BACKUP_DIR/docker-ps-before.txt" 2>/dev/null || true

            # ── Dump PostgreSQL (BLOQUEANTE) ──────────────────────────────────
            log "Dumping database $PRODUCTION_DB..."
            PG_PASS=$(awk -F= '$1=="POSTGRES_PASSWORD"{print $2}' .env.prod | tail -1)
            [ -n "$PG_PASS" ] || fail "POSTGRES_PASSWORD missing in .env.prod"
            sudo docker exec galantes_db sh -c \
              "PGPASSWORD='$PG_PASS' pg_dump -U odoo -Fc '$PRODUCTION_DB'" \
              > "$BACKUP_DIR/$PRODUCTION_DB.dump"
            [ -s "$BACKUP_DIR/$PRODUCTION_DB.dump" ] || fail "Database dump is empty — aborting deploy"
            DUMP_SIZE=$(wc -c < "$BACKUP_DIR/$PRODUCTION_DB.dump")
            log "Dump OK: ${DUMP_SIZE} bytes"

            # ── Backup app data ───────────────────────────────────────────────
            if [ -d data ]; then
              tar -czf "$BACKUP_DIR/app-data.tgz" data --warning=no-file-changed 2>/dev/null || true
            fi

            # ── Manifest ──────────────────────────────────────────────────────
            cat > "$BACKUP_DIR/backup.json" <<MANIFEST
            {
              "createdAt": "$TS",
              "targetSha": "$TARGET_SHA",
              "gitShaBeforeDeploy": "$(git rev-parse HEAD)",
              "database": "$PRODUCTION_DB",
              "dumpBytes": $DUMP_SIZE,
              "tunnelIdBefore": "${TUNNEL_ID_BEFORE:0:12}",
              "tunnelStartedBefore": "$TUNNEL_STARTED_BEFORE"
            }
            MANIFEST
            log "Manifest written"

            # ── ROTACIÓN DE BACKUPS ───────────────────────────────────────────
            log "Rotating old backups (keep=$KEEP_BACKUPS, newest always kept)..."
            mapfile -t all_backups < <(
              find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d | sort -r
            )
            total="${#all_backups[@]}"
            kept=0
            deleted=0
            for i in "${!all_backups[@]}"; do
              dir="${all_backups[$i]}"
              name="$(basename "$dir")"
              # Siempre mantener el más reciente (el que acabamos de crear)
              if [ "$i" -eq 0 ]; then
                log "  KEEP (newest): $name"
                (( kept++ )) || true
                continue
              fi
              # Mantener hasta KEEP_BACKUPS
              if [ "$kept" -lt "$KEEP_BACKUPS" ]; then
                log "  KEEP (slot $kept/$KEEP_BACKUPS): $name"
                (( kept++ )) || true
                continue
              fi
              # Verificar seguridad de ruta
              real_dir="$(realpath "$dir")"
              real_root="$(realpath "$BACKUP_ROOT")"
              if [[ "$real_dir" != "$real_root"/* ]]; then
                log "  SKIP (unsafe path): $real_dir"
                continue
              fi
              log "  DELETE: $name"
              rm -rf "$dir"
              (( deleted++ )) || true
            done
            log "Rotation: kept=$kept deleted=$deleted (total was $total)"

            # ── Limpiar dumps huérfanos ───────────────────────────────────────
            find "$APP_PATH/backups" -name '*.dump' -mtime +7 -delete 2>/dev/null || true

            # ── Limpiar Docker cache para liberar espacio pre-build ───────────
            sudo docker builder prune -af --filter until=72h >/dev/null 2>&1 || true
            sudo docker image prune -af --filter until=168h >/dev/null 2>&1 || true

            log "Disk after cleanup + backup:"
            df -h /
            log "Backup + rotate phase COMPLETE"

      # ── FASE 2: DEPLOY ───────────────────────────────────────────────────────
      - name: Deploy web to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ github.sha }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 45m
          envs: TARGET_SHA,FORCE_REBUILD
          script: |
            set -Eeuo pipefail

            APP_PATH="/home/yoeli/galantesjewelry"
            PRODUCTION_DB="galantes_prod"

            log() { printf '[galantes-deploy] %s\n' "$*"; }
            fail() { printf '[galantes-deploy] FATAL: %s\n' "$*" >&2; exit 1; }

            cd "$APP_PATH"

            # ── Guardarraíl: tunnel antes del deploy ──────────────────────────
            TUNNEL_ID_BEFORE=$(sudo docker inspect -f '{{.Id}}' galantes_tunnel_prod)

            # ── Checkout del SHA objetivo ─────────────────────────────────────
            log "Fetching and checking out $TARGET_SHA"
            git remote set-url origin https://github.com/JoelStalin/Galantesjewerly.git
            git fetch origin main --tags --depth=10
            git checkout --detach -f "$TARGET_SHA"
            log "Checked out: $(git rev-parse HEAD)"

            # ── Build de la imagen web ────────────────────────────────────────
            BUILD_FLAGS=""
            [ "$FORCE_REBUILD" = "true" ] && BUILD_FLAGS="--no-cache"
            log "Building web image $BUILD_FLAGS..."
            sudo docker compose --env-file .env.prod -f docker-compose.production.yml \
              build $BUILD_FLAGS web 2>&1 | tail -20

            # ── Deploy sin bajar otros servicios ─────────────────────────────
            log "Starting updated web container..."
            sudo docker compose --env-file .env.prod -f docker-compose.production.yml \
              up -d --no-deps web

            # ── Actualizar Odoo addon solo si cambió ──────────────────────────
            if git diff --name-only HEAD@{1} HEAD 2>/dev/null | grep -qE '^(odoo|docker-compose.production.yml)'; then
              log "Odoo changes detected — restarting odoo service..."
              sudo docker compose --env-file .env.prod -f docker-compose.production.yml \
                up -d --no-deps odoo
            fi

            # ── Health check post-deploy (con reintentos) ─────────────────────
            log "Waiting for web to be healthy..."
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              HEALTH=$(sudo docker exec galantes_web \
                wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null || echo "")
              if echo "$HEALTH" | grep -q '"status":"ok"'; then
                log "Health check OK (attempt $attempt): $HEALTH"
                break
              fi
              log "  Attempt $attempt: not ready yet..."
              if [ "$attempt" -eq 6 ]; then
                fail "Health check failed after 6 attempts — manual rollback needed"
              fi
            done

            # ── Guardarraíl: tunnel NO reiniciado ────────────────────────────
            TUNNEL_ID_AFTER=$(sudo docker inspect -f '{{.Id}}' galantes_tunnel_prod)
            TUNNEL_RESTARTS=$(sudo docker inspect -f '{{.RestartCount}}' galantes_tunnel_prod)
            if [ "$TUNNEL_ID_BEFORE" != "$TUNNEL_ID_AFTER" ]; then
              fail "FATAL_TUNNEL_GUARDRAIL: tunnel container ID changed during deploy!"
            fi
            log "Tunnel guard OK: ID unchanged, restarts=$TUNNEL_RESTARTS"

            # ── Limpiar imágenes antiguas post-deploy ─────────────────────────
            sudo docker image prune -af --filter until=1h >/dev/null 2>&1 || true

            log "=== DEPLOY SUCCESS ==="
            log "SHA deployed: $(git rev-parse HEAD)"
            log "Disk after deploy:"
            df -h /
