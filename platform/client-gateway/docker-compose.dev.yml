services:
  postgres:
    image: postgres:16
    container_name: orca-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orca
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
    ports:
      - "5432:5432"
    volumes:
      - orca_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: orca-gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  orca_pg_data:
