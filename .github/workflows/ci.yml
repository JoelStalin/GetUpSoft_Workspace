name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    runs-on: ubuntu-latest
    # El package.json/tsconfig.json/proxy.ts de la raiz son un remanente
    # huerfano de un estado anterior a la reorg: no tienen app/components/lib
    # propios. La app Next.js real de Galantes Jewelry vive en
    # apps/galantes-jewelry/, que es un checkout INDEPENDIENTE con su propio
    # .git y remote (github.com/JoelStalin/Galantesjewerly.git, ver
    # .gitignore) -- el mismo patron que apps/getupnet/. Por eso este job NO
    # puede apuntar ahi: ese directorio no existe en un checkout limpio de
    # este repo. Hallazgo P1 en PR #16 (Codex): "next build" en la raiz nunca
    # encuentra un entry point. Confirmado 2026-09-18 -- no es un bug
    # introducido por este PR, es un gap estructural preexistente que
    # requiere una decision del usuario (¿restaurar la app en la raiz?
    # ¿eliminar el package.json huerfano? ¿aceptar que la raiz nunca hizo
    # build?). Typecheck/Build se marcan continue-on-error hasta esa
    # decision, igual que ya estaba Lint.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Unit tests
        continue-on-error: true
        run: npm run test

      - name: Build
        continue-on-error: true
        run: npm run build

  test-python-orca:
    runs-on: ubuntu-latest
    # Ruta actualizada tras la reorg: orca/ -> services/orca/ (heredado de main,
    # fusion de historiales 2026-09-17)
    if: >-
      contains(github.event.head_commit.modified, 'services/orca/') ||
      contains(github.event.head_commit.modified, 'pyproject.toml') ||
      contains(github.event.head_commit.modified, 'uv.lock') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        continue-on-error: true
        run: ruff check services/orca
      - name: Mypy
        continue-on-error: true
        run: mypy services/orca
      - name: Pytest
        continue-on-error: true
        run: pytest services/orca
