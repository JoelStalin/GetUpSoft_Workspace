name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  test-python-orca:
    runs-on: ubuntu-latest
    # Ruta actualizada tras la reorg: orca/ -> services/orca/ (heredado de main,
    # fusion de historiales 2026-09-17)
    if: >-
      contains(github.event.head_commit.modified, 'services/orca/') ||
      contains(github.event.head_commit.modified, 'pyproject.toml') ||
      contains(github.event.head_commit.modified, 'uv.lock') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        continue-on-error: true
        run: ruff check services/orca
      - name: Mypy
        continue-on-error: true
        run: mypy services/orca
      - name: Pytest
        continue-on-error: true
        run: pytest services/orca
