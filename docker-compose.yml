version: '3.8'

# Este archivo combina dos stacks independientes (sin conflicto de nombres/
# puertos entre si) tras la fusion de historiales no relacionados (main +
# careerai/live-browser-run-tracking, 2026-09-17):
# - galantes-jewelry (web/nginx/cloudflared, produccion)
# - odoo19_orca (lab local de Odoo 19 + Postgres)

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galantes_web
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - APP_DATA_DIR=/app/data
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-galantes2026}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-galantes_secret_vault_2026}
    volumes:
      # Carpeta de datos persistente obligatoria
      - ./data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - galante-net

  nginx:
    image: nginx:1.27-alpine
    container_name: galantes_nginx
    restart: always
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - galante-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: galantes_tunnel
    restart: always
    profiles:
      - tunnel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - galante-net

  postgres:
    image: postgres:15-alpine
    container_name: odoo19_postgres
    profiles:
      - odoo-lab
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo19_orca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19.0
    container_name: odoo19_orca
    profiles:
      - odoo-lab
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
      - DB_PORT_5432_TCP_ADDR=postgres
      - DB_PORT_5432_TCP_PORT=5432
      - PGHOST=postgres
      - PGUSER=odoo
      - PGPASSWORD=odoo
      - PGDATABASE=odoo19_orca
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - ./02_Odoo_ERP/Odoo_Consolidated_Library/v19/Modules:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    command: >
      odoo
      --db_user=odoo
      --db_password=odoo
      --db_host=postgres
      --db_port=5432
      --database=odoo19_orca
      --addons-path=/mnt/extra-addons
      --init=base_orca_integration,account_extended,pos_extended,sale_extended,asset_extended,stock_extended,payment_extended,bank_extended,invoice_extended,l10n_do_accounting,l10n_do_accounting_report,l10n_do_pos,l10n_do_rnc_search
      --without-demo=all
      --dev=all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  galante-net:
    driver: bridge

volumes:
  postgres_data:
  odoo_data:
